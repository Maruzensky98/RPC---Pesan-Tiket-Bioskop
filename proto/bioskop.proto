syntax = "proto3";

package bioskop;

service LayananBioskop {
  rpc LihatKursi (JadwalRequest) returns (DaftarKursi);                    // unary
  rpc PesanKursi (PesanRequest) returns (PesanResponse);                   // unary, dilindungi request_id
  rpc BatalPesan (BatalRequest) returns (PesanResponse);                   // unary, dilindungi request_id
  rpc StreamStatusKursi (JadwalRequest) returns (stream PerubahanKursi);   // server streaming

  // ---- khusus admin (butuh admin_token) ----
  rpc AdminBatalPesan (AdminBatalRequest) returns (PesanResponse);         // batalkan pesanan siapa pun
  rpc AdminResetJadwal (AdminResetRequest) returns (PesanResponse);        // kosongkan semua kursi satu jadwal
}

message JadwalRequest { string jadwal_id = 1; }

message Kursi {
  string kode = 1;
  string status = 2;    // "kosong" atau "terpesan"
  string pemesan = 3;
}

message DaftarKursi { repeated Kursi kursi = 1; }

message PesanRequest {
  string request_id = 1;   // untuk deduplikasi (at-most-once)
  string jadwal_id = 2;
  string kode_kursi = 3;
  string pemesan = 4;
}

message BatalRequest {
  string request_id = 1;
  string jadwal_id = 2;
  string kode_kursi = 3;
  string pemesan = 4;
}

message PesanResponse {
  bool sukses = 1;
  string pesan = 2;
}

message PerubahanKursi {
  string jadwal_id = 1;
  string kode = 2;
  string status = 3;
  string pemesan = 4;
}

message AdminBatalRequest {
  string request_id = 1;
  string admin_token = 2;
  string jadwal_id = 3;
  string kode_kursi = 4;
}

message AdminResetRequest {
  string admin_token = 1;
  string jadwal_id = 2;
}
